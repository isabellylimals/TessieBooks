<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TessieVerse</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet" />

  <!-- CSS Modular -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/reviews.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/books.css" />
  <link rel="stylesheet" href="css/explore.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div class="page-bg"></div>

  <div class="header">
    <img src="favicon.svg" alt="Logo" class="logo">
    <h1 class="title">TESSIEVERSE</h1>
  </div>

  <main class="container">
    <!-- Login Section -->
    <section id="login-section" class="fade-in">
      <h2 class="section-title">Entrar na Biblioteca</h2>
      <label class="label">Email</label>
      <input id="email" class="input" type="email" placeholder="seu.email@exemplo.com" />
      <label class="label">Senha</label>
      <input id="password" class="input" type="password" placeholder="••••••••" />
      <button id="loginBtn" class="main-btn">Acessar</button>
      <p id="loginError" class="error"></p>
      <div class="divider"></div>
      <p class="section-description">Não tem conta? <a href="#" id="toggleRegister" class="link">Crie uma agora</a></p>
    </section>

    <!-- Register Section -->
    <section id="register-section" class="fade-in hidden">
      <h2 class="section-title">Criar Conta</h2>
      <label class="label">Nome</label>
      <input id="register-name" class="input" type="text" placeholder="Seu nome completo" />
      <label class="label">Email</label>
      <input id="register-email" class="input" type="email" placeholder="seu.email@exemplo.com" />
      <label class="label">Senha</label>
      <input id="register-password" class="input" type="password" placeholder="••••••••" />
      <small class="info">Mínimo 6 caracteres</small>
      <label class="label">Confirmar Senha</label>
      <input id="register-password-confirm" class="input" type="password" placeholder="••••••••" />
      <button id="registerBtn" class="main-btn">Criar Conta</button>
      <p id="registerError" class="error"></p>
      <div class="divider"></div>
      <p class="section-description">Já tem conta? <a href="#" id="toggleLogin" class="link">Faça login</a></p>
    </section>

    <!-- App Section -->
   <section id="app-section" class="hidden fade-in">
  <!-- Conteúdo será carregado depois do login -->
  <p>Carregando...</p>
</section>
  </main>

  <!-- Modal -->
  <div id="followers-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Seguidores</h3>
        <button onclick="closeModal()" class="modal-close">×</button>
      </div>
      <div id="modal-list" class="modal-list"></div>
    </div>
  </div>

  <!-- Scripts Modulares -->
  <script src="js/utils.js"></script>
  <script src="js/api/authApi.js"></script>
  <script src="js/api/userApi.js"></script>
  <script src="js/api/booksApi.js"></script>
  <script src="js/api/feedApi.js"></script>
  <script src="js/api/reviewsApi.js"></script>
  <script src="js/api/searchApi.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/modules/books.js"></script>
  <script src="js/modules/feed.js"></script>
  <script src="js/modules/reviews.js"></script>
  <script src="js/modules/explore.js"></script>
  <script src="js/modules/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
