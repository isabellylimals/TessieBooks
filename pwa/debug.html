<!DOCTYPE html>
<html>
<head>
    <title>Debug Cadastro</title>
</head>
<body>
    <h1>Debug Cadastro</h1>
    <button onclick="testarCadastro()">Testar Cadastro</button>
    <pre id="output"></pre>

    <script>
        async function testarCadastro() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testando cadastro...\n';

            try {
                const name = 'teste' + Date.now();
                const email = name + '@test.com';
                const password = 'senha123';

                output.innerHTML += `Nome: ${name}\nEmail: ${email}\nSenha: ${password}\n\n`;

                output.innerHTML += 'Enviando requisição...\n';

                const response = await fetch('http://localhost:8080/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                output.innerHTML += `Status: ${response.status}\n`;
                output.innerHTML += `OK: ${response.ok}\n\n`;

                const data = await response.json();
                output.innerHTML += 'Response:\n' + JSON.stringify(data, null, 2);

            } catch (error) {
                output.innerHTML += 'ERRO: ' + error.message + '\n';
                output.innerHTML += error.stack;
            }
        }
    </script>
</body>
</html>
