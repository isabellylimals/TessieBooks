<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Cadastro Simples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f0f0f0;
    }
    .form {
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    input, button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #0056b3;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      margin-top: 20px;
    }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <div class="form">
    <h2>Teste de Cadastro Simples</h2>
    
    <input id="name" type="text" placeholder="Nome" value="Teste Simples" />
    <input id="email" type="email" placeholder="Email" value="simples123@test.com" />
    <input id="password" type="password" placeholder="Senha" value="senha123" />
    <input id="confirm" type="password" placeholder="Confirmar Senha" value="senha123" />
    
    <button onclick="testarCadastro()">Cadastrar</button>
    
    <div id="message" style="margin-top: 10px; font-size: 14px;"></div>
    <pre id="output"></pre>
  </div>

  <script>
    const API_URL = "http://localhost:8080";

    async function testarCadastro() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const messageDiv = document.getElementById("message");
      const output = document.getElementById("output");

      output.innerHTML = "";
      messageDiv.innerHTML = "";

      if (!name || !email || !password || !confirm) {
        messageDiv.innerHTML = "<span class='error'>Preencha todos os campos!</span>";
        return;
      }

      if (password !== confirm) {
        messageDiv.innerHTML = "<span class='error'>Senhas não coincidem!</span>";
        return;
      }

      try {
        output.innerHTML = "Enviando requisição...\n";
        
        const response = await fetch(`${API_URL}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        output.innerHTML += `Status: ${response.status}\n`;
        output.innerHTML += `OK: ${response.ok}\n\n`;

        const data = await response.json();
        
        if (response.ok) {
          output.innerHTML += "<span class='success'>✓ Sucesso!</span>\n\n";
          messageDiv.innerHTML = "<span class='success'>Cadastro realizado com sucesso!</span>";
        } else {
          output.innerHTML += "<span class='error'>✗ Erro na resposta</span>\n\n";
          messageDiv.innerHTML = `<span class='error'>Erro: ${data.message || 'Desconhecido'}</span>`;
        }

        output.innerHTML += "Resposta:\n" + JSON.stringify(data, null, 2);

      } catch (error) {
        output.innerHTML += "ERRO NA REQUISIÇÃO:\n";
        output.innerHTML += error.message + "\n\n";
        output.innerHTML += error.stack;
        messageDiv.innerHTML = `<span class='error'>Erro: ${error.message}</span>`;
      }
    }

    // Testar automaticamente ao carregar
    window.addEventListener('load', () => {
      console.log("Página carregada, API_URL:", API_URL);
    });
  </script>
</body>
</html>
